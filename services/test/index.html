<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE Test</title>
    <style>
        body { font-family: sans-serif; padding: 50px; background: #121212; color: #fff; }
        #log { background: #1e1e1e; padding: 20px; border-radius: 8px; font-family: monospace; }
        .completed { color: #4ade80; }
    </style>
</head>
<body>

    <h2>Live Server Stream</h2>
    <button onclick="startStream()">Start Processing</button>
    
    <div id="log">
        <p>Waiting to start...</p>
    </div>

    <script>
        function startStream() {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML = '<p>Connecting to server...</p>';

            // 1. Open the connection to the Express route
            const eventSource = new EventSource('/api/stream');

            // 2. Listen for messages pushing from the server
            eventSource.onmessage = function(event) {
                console.log("Received data:", event);
                // Parse the JSON string we sent from Express
                const data = JSON.parse(event.data);
                
                // Append it to the screen
                logDiv.innerHTML += `<p>${data.message}</p>`;

                // 3. If the server says it's done, close the connection on the frontend
                if (data.status === 'COMPLETED') {
                    logDiv.innerHTML += `<p class="completed">Connection Closed.</p>`;
                    eventSource.close();
                }
            };

            // Handle connection errors
            eventSource.onerror = function(error) {
                console.error("EventSource failed:", error);
                eventSource.close();
            };
        }
    </script>
</body>
</html>
