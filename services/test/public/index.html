<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripe Checkout Test</title>
    <style>
        body { font-family: system-ui; display: flex; flex-direction: column; align-items: center; margin-top: 100px; background: #f7f9fc; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .buttons { display: flex; gap: 20px; margin-top: 20px; }
        button { padding: 15px 30px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; color: white; transition: 0.2s; }
        button:hover { opacity: 0.9; transform: scale(1.02); }
        #pro-btn { background-color: #635bff; }
        #ent-btn { background-color: #0a2540; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Upgrade Your Account</h2>
        <p>Testing Stripe Checkout & Webhooks</p>
        <div class="buttons">
            <button id="pro-btn">Buy Pro Plan ($10)</button>
            <button id="ent-btn">Buy Enterprise ($20)</button>
        </div>
    </div>

    <script>
        const fakeUserId = "6999a1fa5270c63acebb1617"; 

        const buyPlan = async (planName) => {
            try {
                // Notice we are calling the server that is hosting us!
                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ plan: planName, userId: fakeUserId }) 
                });
                
                const data = await response.json();

                if (data.url) {
                    window.location.href = data.url; // Jump to Stripe
                } else {
                    alert("Error: " + data.error);
                }
            } catch (error) {
                console.error("Network Error:", error);
            }
        };

        document.getElementById('pro-btn').addEventListener('click', () => buyPlan('pro'));
        document.getElementById('ent-btn').addEventListener('click', () => buyPlan('enterprise'));
    </script>
</body>
</html>
