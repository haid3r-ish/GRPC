<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Cancelled</title>
    <style>
        body { font-family: system-ui; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #fff5f5; margin: 0; }
        .box { text-align: center; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #fa5252; }
        a { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #635bff; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>❌ Payment Cancelled</h1>
        <p>You have not been charged. The checkout session was closed.</p>
        <a href="/">Try Again</a>
    </div>
</body>
</html>
